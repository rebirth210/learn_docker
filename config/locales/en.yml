# config/locales 配下のファイルは国際化（i18n）のために使われ、
# Rails によって自動的に読み込まれます。英語以外のロケールを使いたい場合は、
# このディレクトリに必要なファイルを追加してください。
#
# ロケールを使うには `I18n.t` を使用します。
#
#     I18n.t "hello"
#
# ビューではこれを単に `t` として使えます。
#
#     <%= t("hello") %>
#
# 別のロケールを使うには `I18n.locale` を設定します。
#
#     I18n.locale = :es
#
# これにより config/locales/es.yml の内容が使われます。
#
# API の詳細については、Rails の国際化ガイドを参照してください。
# https://guides.rubyonrails.org/i18n.html
#
# YAML では次のような大文字小文字を区別しない文字列が
# 真偽値として解釈されることに注意してください。`true`、`false`、`on`、`off`、`yes`、`no`。
# そのため、文字列として解釈させたい場合は引用符で囲む必要があります。例:
#
#     en:
#       "yes": yup
#       enabled: "ON"

en:
  hello: "Hello world"
